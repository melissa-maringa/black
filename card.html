<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cards Black Friday - Redes Sociais</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Biblioteca HTML2CANVAS para transformar HTML em Imagem baixável -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bf-black: #000000;
            --bf-yellow: #ffcc00;
            --bf-dark: #121212;
        }

        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 5rem;
        }

        /* Barra de Controle do Topo */
        .admin-header {
            background-color: var(--bf-black);
            border-bottom: 3px solid var(--bf-yellow);
            padding: 1.5rem 1rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .stats-badge {
            background-color: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            margin: 0.2rem;
            display: inline-block;
        }
        .stats-badge b { color: var(--bf-yellow); }

        .cat-title-section {
            background: linear-gradient(90deg, #000 0%, #222 100%);
            border-left: 6px solid var(--bf-yellow);
            padding: 0.8rem 1.2rem;
            margin: 2.5rem 0 1.5rem 0;
            border-radius: 0 10px 10px 0;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* GRID DE CARDS */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 25px;
            justify-content: center;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* MOLDURA OFICIAL DO CARD (ISSO QUE SERÁ BAIXADO COMO FOTO) */
        .social-card {
            width: 330px;
            background-color: #ffffff;
            color: #111111;
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid var(--bf-black);
            box-shadow: 0 0 0 2px var(--bf-yellow), 0 10px 25px rgba(0,0,0,0.4);
            position: relative;
        }

        /* Letreiro Superior Black Friday */
        .card-top-banner {
            background-color: var(--bf-black);
            color: var(--bf-yellow);
            text-align: center;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 0.4rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--bf-yellow);
        }

        .img-box {
            width: 100%;
            height: 310px;
            position: relative;
            background-color: #fcfcfc;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Etiqueta de Desconto Oficial */
        .card-discount-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--bf-black);
            color: var(--bf-yellow);
            font-weight: 900;
            font-size: 0.85rem;
            padding: 0.35rem 0.7rem;
            border-radius: 8px;
            border: 1.5px solid var(--bf-yellow);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-body-content {
            padding: 1rem;
            background-color: #ffffff;
        }

        .card-product-title {
            font-size: 1rem;
            font-weight: 900;
            color: #111111;
            margin-bottom: 0.5rem;
            line-height: 1.25;
            min-height: 2.5rem;
        }

        .card-price-container {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 0.6rem;
        }

        .card-price-new {
            font-size: 1.7rem;
            font-weight: 900;
            color: #000000;
            letter-spacing: -1px;
            margin: 0;
        }

        .card-price-old {
            font-size: 0.95rem;
            color: #888888;
            text-decoration: line-through;
            font-weight: 700;
            margin: 0;
        }

        /* Caixa de Numeração Idêntica ao seu print */
        .card-sizes-box {
            background-color: #fffdf5;
            border: 1.5px dashed var(--bf-yellow);
            border-radius: 8px;
            padding: 0.5rem;
            text-align: center;
        }

        .card-sizes-label {
            font-size: 0.65rem;
            color: #555555;
            font-weight: 900;
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.2rem;
        }

        .card-sizes-numbers {
            font-size: 1.05rem;
            font-weight: 900;
            color: #000000;
        }

        /* Rodapé decorativo da loja no card */
        .card-footer-sign {
            background-color: #f7f7f7;
            border-top: 1px solid #eee;
            padding: 0.4rem;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 800;
            color: #444;
            text-transform: uppercase;
        }
        .card-footer-sign span { color: #e6007e; }

        /* Botão de Download */
        .btn-download-card {
            background-color: var(--bf-yellow);
            color: #000;
            font-weight: 900;
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            margin-top: 0.8rem;
            width: 330px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .btn-download-card:hover {
            background-color: #ffd83b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO COM CONTADORES -->
    <header class="admin-header text-center">
        <h3 class="fw-bold mb-2 text-warning"><i class="fa-solid fa-camera"></i> Gerador de Cards para Redes Sociais</h3>
        <p class="text-muted small mb-3">Ordenado por <b>Menor Preço</b> • Clique no botão amarelo para salvar o card em Alta Resolução.</p>
        
        <div id="statsBar">
            <span class="stats-badge">Total Geral: <b id="totalCount">0</b></span>
            <span class="stats-badge">👶 Mini (Bebê): <b id="miniCount">0</b></span>
            <span class="stats-badge">👧 Mel (Infantil): <b id="melCount">0</b></span>
            <span class="stats-badge">👠 Adulto: <b id="adultoCount">0</b></span>
        </div>
    </header>

    <div class="container mt-4">
        
        <!-- SEÇÃO 1: MINI -->
        <div class="cat-title-section">
            <span>👶 MINI (Bebê - 17 ao 28)</span>
            <span class="badge bg-warning text-dark fs-6" id="badgeMini">0 modelos</span>
        </div>
        <div class="cards-grid" id="gridBebe"></div>

        <!-- SEÇÃO 2: MEL -->
        <div class="cat-title-section">
            <span>👧 MEL (Infantil - 26 ao 33)</span>
            <span class="badge bg-warning text-dark fs-6" id="badgeMel">0 modelos</span>
        </div>
        <div class="cards-grid" id="gridInfantil"></div>

        <!-- SEÇÃO 3: ADULTO -->
        <div class="cat-title-section">
            <span>👠 ADULTO (33 ao 40)</span>
            <span class="badge bg-warning text-dark fs-6" id="badgeAdulto">0 modelos</span>
        </div>
        <div class="cards-grid" id="gridAdulto"></div>

    </div>

    <script>
        let allProducts = [];

        function formatMoney(value) { return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function calculateDiscount(oldP, newP) { return Math.round(((oldP - newP) / oldP) * 100); }

        // Sistema inteligente para fotos não quebrarem
        function handleImageError(imgElement, reference) {
            const currentSrc = imgElement.src;
            if (currentSrc.includes('.avif') && !imgElement.dataset.triedWebp) {
                imgElement.dataset.triedWebp = "true";
                imgElement.src = currentSrc.replace('.avif', '.webp');
            } else if (currentSrc.includes('.webp') && !imgElement.dataset.triedJpg) {
                imgElement.dataset.triedJpg = "true";
                imgElement.src = currentSrc.replace('.webp', '.jpg');
            } else if (currentSrc.includes('.jpg') && !imgElement.dataset.triedPng) {
                imgElement.dataset.triedPng = "true";
                imgElement.src = currentSrc.replace('.jpg', '.png');
            } else if (!imgElement.dataset.triedDefaultAvif) {
                imgElement.dataset.triedDefaultAvif = "true";
                imgElement.src = `img/${reference}.avif`; 
            } else if (!imgElement.dataset.triedDefaultWebp) {
                imgElement.dataset.triedDefaultWebp = "true";
                imgElement.src = `img/${reference}.webp`; 
            } else if (!imgElement.dataset.triedDefaultJpg) {
                imgElement.dataset.triedDefaultJpg = "true";
                imgElement.src = `img/${reference}.jpg`; 
            } else if (!imgElement.dataset.triedDefaultPng) {
                imgElement.dataset.triedDefaultPng = "true";
                imgElement.src = `img/${reference}.png`; 
            } else {
                imgElement.src = 'https://via.placeholder.com/500x500?text=Melissa'; 
            }
        }

        // Função que baixa o card exato em Alta Definição (PNG)
        function downloadCard(cardId, fileName) {
            const cardElement = document.getElementById(cardId);
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Gerando Foto...`;
            btn.disabled = true;

            html2canvas(cardElement, {
                scale: 2.5, // Resolução 2.5x para ficar nítido no Stories / WhatsApp
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `CARD-${fileName}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                btn.innerHTML = `<i class="fa-solid fa-check"></i> Baixado!`;
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 1500);
            }).catch(err => {
                alert("Erro ao gerar imagem. Verifique se a foto do produto existe.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }

        function createCardHtml(product, index) {
            const discount = calculateDiscount(product.priceOriginal, product.pricePromo);
            const imgName = product.imageFile || product.reference;
            const cardUniqueId = `card-node-${index}`;

            return `
                <div class="card-wrapper mb-4">
                    <!-- ÁREA DO CARD (O QUE VIRA IMAGEM) -->
                    <div class="social-card" id="${cardUniqueId}">
                        <div class="card-top-banner">
                            <i class="fa-solid fa-bolt"></i> BLACK FRIDAY • CLUBE MARINGÁ PARK
                        </div>
                        <div class="img-box">
                            <div class="card-discount-badge"><i class="fa-solid fa-tag"></i> ${discount}% OFF</div>
                            <img src="img/${imgName}.avif" alt="${product.title}" class="product-img" onerror="handleImageError(this, '${product.reference}')">
                        </div>
                        <div class="card-body-content">
                            <div class="card-product-title">${product.title}</div>
                            <div class="card-price-container">
                                <span class="card-price-new">${formatMoney(product.pricePromo)}</span>
                                <span class="card-price-old">${formatMoney(product.priceOriginal)}</span>
                            </div>
                            <div class="card-sizes-box">
                                <span class="card-sizes-label">NÚMEROS NA PROMOÇÃO:</span>
                                <span class="card-sizes-numbers">${product.sizes}</span>
                            </div>
                        </div>
                        <div class="card-footer-sign">
                            Chame no WhatsApp do <span>Léo</span> • Estoque Limitado!
                        </div>
                    </div>

                    <!-- BOTÃO FORA DO CARD (NÃO SAI NA FOTO) -->
                    <button class="btn-download-card" onclick="downloadCard('${cardUniqueId}', '${imgName}')">
                        <i class="fa-solid fa-download"></i> Baixar Imagem (HD)
                    </button>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetch('produtos.json')
                .then(res => res.json())
                .then(data => {
                    allProducts = data;

                    // 1. ORDENAR TODOS DO MENOR PARA O MAIOR VALOR PROMOCIONAL
                    allProducts.sort((a, b) => a.pricePromo - b.pricePromo);

                    // 2. SEPARAR POR CATEGORIAS
                    const bebeList = allProducts.filter(p => p.category === 'bebe');
                    const infantilList = allProducts.filter(p => p.category === 'infantil');
                    const adultoList = allProducts.filter(p => p.category === 'adulto');

                    // 3. ATUALIZAR CONTADORES DO TOPO
                    document.getElementById('totalCount').innerText = allProducts.length;
                    document.getElementById('miniCount').innerText = bebeList.length;
                    document.getElementById('melCount').innerText = infantilList.length;
                    document.getElementById('adultoCount').innerText = adultoList.length;

                    document.getElementById('badgeMini').innerText = `${bebeList.length} modelos`;
                    document.getElementById('badgeMel').innerText = `${infantilList.length} modelos`;
                    document.getElementById('badgeAdulto').innerText = `${adultoList.length} modelos`;

                    // 4. RENDERIZAR CARDS NAS SEÇÕES RESPECTIVAS
                    let indexCounter = 0;

                    const gridBebe = document.getElementById('gridBebe');
                    bebeList.forEach(p => { gridBebe.innerHTML += createCardHtml(p, indexCounter++); });

                    const gridInfantil = document.getElementById('gridInfantil');
                    infantilList.forEach(p => { gridInfantil.innerHTML += createCardHtml(p, indexCounter++); });

                    const gridAdulto = document.getElementById('gridAdulto');
                    adultoList.forEach(p => { gridAdulto.innerHTML += createCardHtml(p, indexCounter++); });
                })
                .catch(err => {
                    console.error("Erro ao carregar produtos.json", err);
                    alert("Erro ao carregar o arquivo produtos.json. Certifique-se de que ele está na mesma pasta!");
                });
        });
    </script>
</body>
</html>
