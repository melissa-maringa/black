<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cards Black Friday - Redes Sociais</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Biblioteca HTML2CANVAS para capturar o card em PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Biblioteca JSZip para compactar e baixar todos de uma vez -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bf-black: #000000;
            --bf-yellow: #ffcc00;
            --bf-dark: #121212;
        }

        body {
            background-color: #141414;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 5rem;
        }

        /* Barra Superior */
        .admin-header {
            background-color: var(--bf-black);
            border-bottom: 3px solid var(--bf-yellow);
            padding: 1.5rem 1rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .stats-badge {
            background-color: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            margin: 0.2rem;
            display: inline-block;
        }
        .stats-badge b { color: var(--bf-yellow); }

        /* Títulos de Categorias com Botão Baixar Tudo */
        .cat-title-section {
            background: linear-gradient(90deg, #000 0%, #222 100%);
            border-left: 6px solid var(--bf-yellow);
            padding: 0.8rem 1.2rem;
            margin: 2.5rem 0 1.5rem 0;
            border-radius: 0 12px 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cat-title-text {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.1rem;
        }

        .btn-zip-download {
            background-color: var(--bf-yellow);
            color: #000;
            font-weight: 900;
            border: none;
            border-radius: 8px;
            padding: 0.45rem 1rem;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-zip-download:hover {
            background-color: #ffd83b;
            transform: scale(1.03);
        }

        /* GRID */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
            justify-content: center;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* MOLDURA EXTERNA (ISSO GARANTE A MARGEM AMARELA NO ARQUIVO FINAL) */
        .social-card {
            width: 340px;
            background-color: var(--bf-yellow); /* Margem Amarela Real */
            padding: 5px; /* Espessura da margem amarela */
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
            display: inline-block;
        }

        /* CORPO INTERNO COM BORDA PRETA */
        .social-card-inner {
            background-color: #ffffff;
            color: #111111;
            border-radius: 13px;
            overflow: hidden;
            border: 3px solid var(--bf-black); /* Borda Preta Interna */
            position: relative;
        }

        /* Faixa Superior Black Friday */
        .card-top-banner {
            background-color: var(--bf-black);
            color: var(--bf-yellow);
            text-align: center;
            font-size: 0.8rem;
            font-weight: 900;
            padding: 0.45rem 0.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--bf-yellow);
        }

        .img-box {
            width: 100%;
            height: 310px;
            position: relative;
            background-color: #fbfbfb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Etiqueta % OFF */
        .card-discount-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--bf-black);
            color: var(--bf-yellow);
            font-weight: 900;
            font-size: 0.85rem;
            padding: 0.35rem 0.7rem;
            border-radius: 8px;
            border: 1.5px solid var(--bf-yellow);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-body-content {
            padding: 1rem;
            background-color: #ffffff;
        }

        .card-product-title {
            font-size: 1rem;
            font-weight: 900;
            color: #111111;
            margin-bottom: 0.5rem;
            line-height: 1.25;
            min-height: 2.5rem;
        }

        .card-price-container {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 0.6rem;
        }

        .card-price-new {
            font-size: 1.75rem;
            font-weight: 900;
            color: #000000;
            letter-spacing: -1px;
            margin: 0;
        }

        .card-price-old {
            font-size: 0.95rem;
            color: #888888;
            text-decoration: line-through;
            font-weight: 700;
            margin: 0;
        }

        /* Caixa de Numeração */
        .card-sizes-box {
            background-color: #fffdf5;
            border: 1.5px dashed var(--bf-yellow);
            border-radius: 8px;
            padding: 0.55rem;
            text-align: center;
        }

        .card-sizes-label {
            font-size: 0.68rem;
            color: #555555;
            font-weight: 900;
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.2rem;
        }

        .card-sizes-numbers {
            font-size: 1.05rem;
            font-weight: 900;
            color: #000000;
        }

        /* Botão de Download Individual */
        .btn-download-single {
            background-color: var(--bf-yellow);
            color: #000;
            font-weight: 900;
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            margin-top: 0.8rem;
            width: 340px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .btn-download-single:hover {
            background-color: #ffd83b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO COM CONTADORES -->
    <header class="admin-header text-center">
        <h3 class="fw-bold mb-2 text-warning"><i class="fa-solid fa-camera"></i> Gerador de Cards para Redes Sociais</h3>
        <p class="text-muted small mb-3">Ordenado por <b>Menor Preço</b> • Baixe individualmente ou baixe a categoria inteira em ZIP.</p>
        
        <div id="statsBar">
            <span class="stats-badge">Total Geral: <b id="totalCount">0</b></span>
            <span class="stats-badge">👶 Mini (Bebê): <b id="miniCount">0</b></span>
            <span class="stats-badge">👧 Mel (Infantil): <b id="melCount">0</b></span>
            <span class="stats-badge">👠 Adulto: <b id="adultoCount">0</b></span>
        </div>
    </header>

    <div class="container mt-4">
        
        <!-- SEÇÃO 1: MINI -->
        <div class="cat-title-section">
            <div class="cat-title-text">
                <span>👶 MINI (Bebê - 17 ao 28)</span>
                <span class="badge bg-warning text-dark fs-6 ms-2" id="badgeMini">0</span>
            </div>
            <button class="btn-zip-download" onclick="downloadCategoryZip('gridBebe', 'MINI_BEBE', this)">
                <i class="fa-solid fa-file-zipper"></i> Baixar Todos desta Categoria (ZIP)
            </button>
        </div>
        <div class="cards-grid" id="gridBebe"></div>

        <!-- SEÇÃO 2: MEL -->
        <div class="cat-title-section">
            <div class="cat-title-text">
                <span>👧 MEL (Infantil - 26 ao 33)</span>
                <span class="badge bg-warning text-dark fs-6 ms-2" id="badgeMel">0</span>
            </div>
            <button class="btn-zip-download" onclick="downloadCategoryZip('gridInfantil', 'MEL_INFANTIL', this)">
                <i class="fa-solid fa-file-zipper"></i> Baixar Todos desta Categoria (ZIP)
            </button>
        </div>
        <div class="cards-grid" id="gridInfantil"></div>

        <!-- SEÇÃO 3: ADULTO -->
        <div class="cat-title-section">
            <div class="cat-title-text">
                <span>👠 ADULTO (33 ao 40)</span>
                <span class="badge bg-warning text-dark fs-6 ms-2" id="badgeAdulto">0</span>
            </div>
            <button class="btn-zip-download" onclick="downloadCategoryZip('gridAdulto', 'ADULTO', this)">
                <i class="fa-solid fa-file-zipper"></i> Baixar Todos desta Categoria (ZIP)
            </button>
        </div>
        <div class="cards-grid" id="gridAdulto"></div>

    </div>

    <script>
        let allProducts = [];

        function formatMoney(value) { return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function calculateDiscount(oldP, newP) { return Math.round(((oldP - newP) / oldP) * 100); }

        function handleImageError(imgElement, reference) {
            const currentSrc = imgElement.src;
            if (currentSrc.includes('.avif') && !imgElement.dataset.triedWebp) {
                imgElement.dataset.triedWebp = "true";
                imgElement.src = currentSrc.replace('.avif', '.webp');
            } else if (currentSrc.includes('.webp') && !imgElement.dataset.triedJpg) {
                imgElement.dataset.triedJpg = "true";
                imgElement.src = currentSrc.replace('.webp', '.jpg');
            } else if (currentSrc.includes('.jpg') && !imgElement.dataset.triedPng) {
                imgElement.dataset.triedPng = "true";
                imgElement.src = currentSrc.replace('.jpg', '.png');
            } else if (!imgElement.dataset.triedDefaultAvif) {
                imgElement.dataset.triedDefaultAvif = "true";
                imgElement.src = `img/${reference}.avif`; 
            } else if (!imgElement.dataset.triedDefaultWebp) {
                imgElement.dataset.triedDefaultWebp = "true";
                imgElement.src = `img/${reference}.webp`; 
            } else if (!imgElement.dataset.triedDefaultJpg) {
                imgElement.dataset.triedDefaultJpg = "true";
                imgElement.src = `img/${reference}.jpg`; 
            } else if (!imgElement.dataset.triedDefaultPng) {
                imgElement.dataset.triedDefaultPng = "true";
                imgElement.src = `img/${reference}.png`; 
            } else {
                imgElement.src = 'https://via.placeholder.com/500x500?text=Melissa'; 
            }
        }

        // 1. Download Individual (1 Card)
        function downloadSingleCard(cardId, fileName, btn) {
            const cardElement = document.getElementById(cardId);
            const originalText = btn.innerHTML;
            
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Gerando...`;
            btn.disabled = true;

            html2canvas(cardElement, {
                scale: 2.5,
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `CARD-${fileName}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                btn.innerHTML = `<i class="fa-solid fa-check"></i> Baixado!`;
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 1500);
            }).catch(err => {
                alert("Erro ao gerar imagem.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }

        // 2. Download em Massa por Categoria (Gera 1 arquivo .ZIP)
        async function downloadCategoryZip(gridId, categoryName, btn) {
            const grid = document.getElementById(gridId);
            const cards = grid.querySelectorAll('.social-card');
            
            if (cards.length === 0) {
                alert("Nenhum produto para baixar nesta categoria!");
                return;
            }

            const originalText = btn.innerHTML;
            btn.disabled = true;

            const zip = new JSZip();

            for (let i = 0; i < cards.length; i++) {
                const card = cards[i];
                const fileName = card.dataset.filename || `card-${i+1}`;
                
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Criando ${i+1}/${cards.length}...`;

                const canvas = await html2canvas(card, {
                    scale: 2.2,
                    useCORS: true,
                    backgroundColor: null
                });

                const base64Data = canvas.toDataURL('image/png').replace(/^data:image\/png;base64,/, "");
                zip.file(`CARD-${fileName}.png`, base64Data, {base64: true});
            }

            btn.innerHTML = `<i class="fa-solid fa-compacting fa-spin"></i> Compactando ZIP...`;
            const zipBlob = await zip.generateAsync({type: "blob"});
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(zipBlob);
            link.download = `CARDS-${categoryName}.zip`;
            link.click();
            URL.revokeObjectURL(link.href);

            btn.innerHTML = `<i class="fa-solid fa-check"></i> ZIP Baixado!`;
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }, 3000);
        }

        function createCardHtml(product, index) {
            const discount = calculateDiscount(product.priceOriginal, product.pricePromo);
            const imgName = product.imageFile || product.reference;
            const cardUniqueId = `card-node-${index}`;

            return `
                <div class="card-wrapper mb-4">
                    <!-- MOLDURA EXTERNA (AMARELA) + INTERNA (PRETA) -->
                    <div class="social-card" id="${cardUniqueId}" data-filename="${imgName}">
                        <div class="social-card-inner">
                            <div class="card-top-banner">
                                <i class="fa-solid fa-bolt"></i> BLACK FRIDAY • CLUBE MARINGÁ PARK
                            </div>
                            <div class="img-box">
                                <div class="card-discount-badge"><i class="fa-solid fa-tag"></i> ${discount}% OFF</div>
                                <img src="img/${imgName}.avif" alt="${product.title}" class="product-img" onerror="handleImageError(this, '${product.reference}')">
                            </div>
                            <div class="card-body-content">
                                <div class="card-product-title">${product.title}</div>
                                <div class="card-price-container">
                                    <span class="card-price-new">${formatMoney(product.pricePromo)}</span>
                                    <span class="card-price-old">${formatMoney(product.priceOriginal)}</span>
                                </div>
                                <div class="card-sizes-box">
                                    <span class="card-sizes-label">NÚMEROS NA PROMOÇÃO:</span>
                                    <span class="card-sizes-numbers">${product.sizes}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- BOTÃO INDIVIDUAL -->
                    <button class="btn-download-single" onclick="downloadSingleCard('${cardUniqueId}', '${imgName}', this)">
                        <i class="fa-solid fa-download"></i> Baixar Imagem (HD)
                    </button>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetch('produtos.json')
                .then(res => res.json())
                .then(data => {
                    allProducts = data;

                    // 1. ORDENAR PELO MENOR PREÇO PROMOCIONAL
                    allProducts.sort((a, b) => a.pricePromo - b.pricePromo);

                    // 2. SEPARAR CATEGORIAS
                    const bebeList = allProducts.filter(p => p.category === 'bebe');
                    const infantilList = allProducts.filter(p => p.category === 'infantil');
                    const adultoList = allProducts.filter(p => p.category === 'adulto');

                    // 3. CONTADORES DO TOPO
                    document.getElementById('totalCount').innerText = allProducts.length;
                    document.getElementById('miniCount').innerText = bebeList.length;
                    document.getElementById('melCount').innerText = infantilList.length;
                    document.getElementById('adultoCount').innerText = adultoList.length;

                    document.getElementById('badgeMini').innerText = `${bebeList.length} modelos`;
                    document.getElementById('badgeMel').innerText = `${infantilList.length} modelos`;
                    document.getElementById('badgeAdulto').innerText = `${adultoList.length} modelos`;

                    // 4. RENDERIZAR CARDS
                    let indexCounter = 0;

                    const gridBebe = document.getElementById('gridBebe');
                    bebeList.forEach(p => { gridBebe.innerHTML += createCardHtml(p, indexCounter++); });

                    const gridInfantil = document.getElementById('gridInfantil');
                    infantilList.forEach(p => { gridInfantil.innerHTML += createCardHtml(p, indexCounter++); });

                    const gridAdulto = document.getElementById('gridAdulto');
                    adultoList.forEach(p => { gridAdulto.innerHTML += createCardHtml(p, indexCounter++); });
                })
                .catch(err => {
                    console.error("Erro ao carregar produtos.json", err);
                    alert("Erro ao carregar produtos.json.");
                });
        });
    </script>
</body>
</html>
